# sil-wide-long with three times the steps, on the scored cells only (10-40 nm): its
# validation loss was still falling when the schedule ended
model:
  arch: classic
  hidden_channels: 128
  num_blocks: 4
  zero_init: true
  formulation: sil
learning_rate: 3.0e-4
batch_size: 16
num_steps: 60000
val_every: 3000
pool_factors: [2, 4, 8]
unroll: 8
augment: true
