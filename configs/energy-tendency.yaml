# k1-wide-long's network as a learned energy of m alone, fitted by matching the block-mean
# dm/dt of the 5 nm truth on single snapshots (no rollouts)
model:
  arch: classic
  hidden_channels: 128
  num_blocks: 4
  zero_init: true
  formulation: energy
  fields: false
learning_rate: 3.0e-4
batch_size: 16
num_steps: 20000
val_every: 2000
pool_factors: [1, 2, 4, 8]
unroll: 1
augment: true
objective: tendency
