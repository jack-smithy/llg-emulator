# sil-k248-60k fine-tuned on 16-step rollouts (as sil-ft-u16, which took sil-wide-long
# from 0.306 to 0.283), at half that learning rate with a warmup
model:
  arch: classic
  hidden_channels: 128
  num_blocks: 4
  zero_init: true
  formulation: sil
init_from: sil-k248-60k/seed_0
learning_rate: 5.0e-5
warmup_steps: 500
batch_size: 16
num_steps: 6000
val_every: 1000
pool_factors: [2, 4, 8]
unroll: 16
augment: true
