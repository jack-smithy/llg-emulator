# k1-wide-long's recipe (rollouts, unroll 8) with the closure as a learned energy of m alone
model:
  arch: classic
  hidden_channels: 128
  num_blocks: 4
  zero_init: true
  formulation: energy
  fields: false
learning_rate: 3.0e-4
batch_size: 16
num_steps: 20000
val_every: 2000
pool_factors: [1, 2, 4, 8]
unroll: 8
augment: true
