# Default training config — mirrors the previous hardcoded train.py values.
# Quick-iteration run (10 epochs). Copy this file per experiment.

seed = 0
epochs = 10
checkpoint_every = 8

[model]
hidden_channels = 32
num_modes = 12
num_blocks = 4
activation = "gelu"

[data]
size = "small"          # small | med
warmup_steps = 1
batch_size = 128
viz_sample = "val/sample_292"

[optim]
name = "adam"
lr = 1e-3
