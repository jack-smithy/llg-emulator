# Default training config (128 epochs). Copy this file per experiment.

seed = 0
epochs = 128
checkpoint_every = 16

[model]
hidden_channels = 64
num_blocks = 4
activation = "gelu"

[data]
size = "small"          # small | med
batch_size = 50
viz_sample = "sp4/sample_0"

[optim]
name = "adam"
lr = 1e-4
