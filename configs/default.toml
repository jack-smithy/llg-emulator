# Default training config — mirrors the previous hardcoded train.py values.
# Quick-iteration run (10 epochs). Copy this file per experiment.

seed = 0
epochs = 128
checkpoint_every = 8

[model]
hidden_channels = 32
num_blocks = 4
activation = "gelu"

[data]
size = "small"          # small | med
warmup_steps = 1
batch_size = 64
viz_sample = "sp4/sample_0"

[optim]
name = "adam"
lr = 1e-4
