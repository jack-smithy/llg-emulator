# Default training config (128 epochs). Copy this file per experiment.

seed = 0
epochs = 8
checkpoint_every = 4

[model]
hidden_channels = 64
num_blocks = 4
activation = "gelu"

[data]
size = "med"          # small | med
batch_size = 64
viz_sample = "sp4/sample_0"
pushforward_steps = 2 # detached rollout steps in the loss (0 = plain one-step)

[optim]
name = "adam"
lr = 1e-4
