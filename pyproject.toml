[project]
name = "llg-emulator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.15.0",
    "h5py>=3.16.0",
    "jax>=0.11.2",
    "magnumnp>=2.2.0",
    "neuralmag>=1.0.0",
    "neuraloperator",
    "pdequinox>=0.1.2",
    "pyyaml>=6.0.3",
    "the-well>=1.2.0",
    "torch>=2.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llg_emulator", "src/datagen"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "ruff>=0.16.4",
]

[project.scripts]
train = "llg_emulator.train:main"


[tool.ruff.lint]
ignore=["F722", "F541", "E402", "I001", "PLR0402"]

[tool.uv.sources]
neuraloperator = { path = "../neuraloperator" }
