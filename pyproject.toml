[project]
name = "llg-emulator"
version = "0.1.0"
description = "FNO emulator for LLG micromagnetics of permalloy thin films"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.15.0",
    "h5py>=3.16.0",
    "jax[cuda13]>=0.11.2",
    "magnumnp>=2.2.0",
    "neuralmag[jax]>=1.0.0",
    "optax>=0.2.8",
    "pdequinox",
    "pyyaml>=6.0.3",
    "the-well>=1.2.0",
    "torch>=2.14.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "ruff>=0.16.4",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["F722", "E402"]  # jaxtyping's string annotations; physics.py restores an env var before importing neuralmag

[tool.uv.sources]
pdequinox = { path = "../pdequinox" }
