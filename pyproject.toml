[project]
name = "llg-emulator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "h5py>=3.16.0",
    "magnumnp>=2.2.0",
    "neuraloperator>=2.0.0",
    "pyyaml>=6.0.3",
    "the-well>=1.2.0",
    "torch>=2.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llg_emulator", "src/datagen"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "ruff>=0.16.4",
]

[project.scripts]
train = "llg_emulator.train:main"
