[project]
name = "llg-emulator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "diffrax>=0.7.2",
    "einops>=0.8.2",
    "equinox>=0.13.8",
    "grain>=0.2.17",
    "jax[cuda12]>=0.10.0",
    "jaxtyping>=0.3.9",
    "matplotlib>=3.10.9",
    "nbformat>=5.10.4",
    "neuralmag>=0.9.4",
    "optax>=0.2.8",
    "pdequinox>=0.1.2",
    "plotly>=6.8.0",
    "torch>=2.11.0",
    "tqdm>=4.67.3",
    "wandb>=0.18.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llg_emulator"]

[project.scripts]
train = "llg_emulator:main"