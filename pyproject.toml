[project]
name = "llg-emulator"
version = "0.1.0"
description = "FNO emulator for LLG micromagnetics of permalloy thin films"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "ruff>=0.16.4",
]

[tool.ruff.lint]
ignore=["F722", "F541", "E402", "I001", "PLR0402"]
